name: Verify and mirror release sources
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact public sources and reproduce audited archive
        run: python tools/reproduce_source_archive.py --output outputs/chathelp-windows-1.0.0-glm-dependency-sources.zip
      - name: Upload verified sources to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0-glm outputs/chathelp-windows-1.0.0-glm-dependency-sources.zip --repo "$GITHUB_REPOSITORY"
