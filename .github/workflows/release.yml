name: Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [glm]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.6'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean jev.spec
      - shell: pwsh
        run: |
          Copy-Item LICENSE, NOTICE, COPYING, README.md, PRIVACY.md, LICENSING.md, BUILDING.md, THIRD_PARTY_NOTICES.md -Destination dist/chathelp-glm
          Compress-Archive -Path dist/chathelp-glm -DestinationPath chathelp-windows-ci.zip
      - uses: actions/upload-artifact@v4
        with:
          name: chathelp-windows-ci
          path: chathelp-windows-ci.zip
          if-no-files-found: error
